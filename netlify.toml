[build]
  command = "npm --prefix client install --no-save --force @rollup/rollup-linux-x64-gnu@4.63.3 && npm run build"
  publish = "client/dist"

[build.environment]
  NODE_VERSION = "22"

# Cache artwork at the CDN/browser edge without making same-path art impossible
# to refresh after a later deploy. The HTML entrypoint remains revalidated.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/assets/background/*.mp4"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"
    Accept-Ranges = "bytes"
